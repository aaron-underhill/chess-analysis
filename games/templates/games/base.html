{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chess Analysis{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'games/style.css' %}">
  <script>
    // Apply a saved theme before the page draws, so it never flashes the
    // wrong colors. With nothing saved, the device's setting decides.
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{% url 'games:dashboard' %}">&#9822; Chess Analysis</a>
      <div class="header-right">
        <span class="who">AaronDaGG on Chess.com</span>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch color theme"></button>
      </div>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap site-footer">
    Built with Django by Aaron Underhill &middot;
    <a href="https://github.com/aaron-underhill/chess-analysis">Source on GitHub</a>
  </footer>
  <script>
    // Dark mode toggle. Remembers the choice in this browser.
    (function () {
      const root = document.documentElement;
      const button = document.getElementById("theme-toggle");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
      const current = () => root.dataset.theme || (prefersDark.matches ? "dark" : "light");
      const label = () => {
        button.textContent = current() === "dark" ? "\u2600\uFE0E Light mode" : "\u263E Dark mode";
      };
      button.addEventListener("click", () => {
        const next = current() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      prefersDark.addEventListener("change", label);
      label();
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
